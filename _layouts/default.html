<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13201A">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NGO",
    "name": "Les Architectes de la Réussite",
    "alternateName": "LADR",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "logo": "{{ site.url }}{{ site.baseurl }}/assets/img/logo.png",
    "image": "{{ site.url }}{{ site.baseurl }}/assets/img/og-image.jpg",
    "description": "{{ site.description | strip_newlines | strip }}",
    "slogan": "Former, équiper, transmettre",
    "foundingDate": "2026",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "36 rue Baudin",
      "postalCode": "92400",
      "addressLocality": "Courbevoie",
      "addressCountry": "FR"
    },
    {% if site.org.email != "" %}"email": "{{ site.org.email }}",{% endif %}
    "areaServed": [
      { "@type": "Country", "name": "France" },
      { "@type": "Country", "name": "Algérie" },
      { "@type": "Place", "name": "Afrique" }
    ],
    "knowsAbout": ["Formation des jeunes", "Action humanitaire", "Solidarité numérique", "Accompagnement des orphelinats"]{% if site.org.linkedin != "" %},
    "sameAs": ["{{ site.org.linkedin }}"]{% endif %}
  }
  </script>
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  {% include cookies.html %}
  <script>
    // menu mobile
    (function(){
      var b=document.querySelector('.burger'), m=document.querySelector('.mobile-menu');
      if(b&&m){ b.addEventListener('click',function(){ m.classList.toggle('open'); }); }
    })();
    // clics WhatsApp (mesurés seulement si l'internaute a accepté les cookies) :
    // contact avec l'association (lien avec numéro) ou partage d'une action (lien sans numéro)
    document.addEventListener('click', function(e){
      var a=e.target.closest ? e.target.closest('a[href*="wa.me/"]') : null;
      if(!a || !window.gtag) return;
      if(/wa\.me\/\d/.test(a.href)) gtag('event','contact_whatsapp',{wa_motif:a.getAttribute('data-wa')||'autre'});
      else gtag('event','share',{method:'WhatsApp',content_type:'action'});
    });
    // formulaires Formspree : envoi sans quitter la page
    (function(){
      if(!window.fetch || !window.FormData) return;
      document.querySelectorAll('form.js-form').forEach(function(f){
        f.addEventListener('submit', function(e){
          e.preventDefault();
          var st=document.getElementById(f.getAttribute('data-status'));
          var btn=f.querySelector('[type="submit"]'), label=btn.textContent;
          btn.disabled=true; btn.textContent='Envoi…';
          fetch(f.action,{method:'POST',body:new FormData(f),headers:{'Accept':'application/json'}})
            .then(function(r){
              if(!r.ok) throw new Error(r.status);
              f.reset();
              if(window.gtag) gtag('event', f.getAttribute('data-event') || (f.id==='newsletter-form' ? 'sign_up' : 'generate_lead'));
              st.className='form-status ok'; st.textContent=f.getAttribute('data-success');
            })
            .catch(function(){
              st.className='form-status err';
              st.textContent="L'envoi n'a pas abouti. Réessayez dans un instant, ou écrivez-nous à {{ site.org.email }}.";
            })
            .then(function(){ st.hidden=false; btn.disabled=false; btn.textContent=label; });
        });
      });
    })();
  </script>
</body>
</html>
