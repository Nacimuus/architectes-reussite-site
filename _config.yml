title: "Les Architectes de la Réussite"
tagline: "Former, équiper, transmettre"
description: >-
  Association loi 1901 qui relie les jeunesses de France et d'Afrique par la
  formation, l'action humanitaire et la solidarité numérique.
lang: fr

# --- SEO / partage social (jekyll-seo-tag) ---
logo: /assets/img/logo.png
author: "Les Architectes de la Réussite"
twitter:
  card: summary_large_image
social:
  name: "Les Architectes de la Réussite"
  links: []        # LinkedIn et autres profils ajoutés dès qu'ils existent
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.jpg

# --- URL ---
# Pour un site de projet GitHub Pages (nacimuus.github.io/architectes-reussite-site) :
url: "https://lesarchitectesdelareussite.com"
baseurl: ""
# Quand le nom de domaine personnalisé sera branché, remplacez par :
#   url: "https://votre-domaine.org"
#   baseurl: ""

# --- Coordonnées association ---
org:
  address: "36 rue Baudin, 92400 Courbevoie, France"
  email: "contact@lesarchitectesdelareussite.com"
  rna: ""            # à compléter dès réception du récépissé
  linkedin: ""       # à renseigner
  helloasso: ""      # URL de la campagne HelloAsso (Phase 0)
  formspree: "https://formspree.io/f/xbgojzko"

# --- Build ---
permalink: pretty

collections:
  activites:
    output: false
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
