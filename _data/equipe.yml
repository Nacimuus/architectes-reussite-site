# Équipe affichée sur la page L'association (/qui-sommes-nous/), dans l'ordre de la liste.
# photo : chemin vers l'image (format .webp conseillé, portrait). Laisser vide pour afficher les initiales.
# competences : 3 ou 4 compétences courtes.
# presentation : un paragraphe (affiché au dos de la carte).

- prenom: "Nacim"
  nom: "Touenti"
  role: "Président & fondateur"
  photo: "/assets/img/team-nacim-card.webp"
  competences:
    - "Gestion de projet internationale"
    - "Formation et pédagogie"
    - "Paiement électronique"
    - "Stratégie et partenariats"
  presentation: "Directeur de projet à l'échelle EMEA dans le secteur du paiement électronique, Nacim intervient aussi en MBA et en Master. Il a fondé l'association pour transmettre ce qu'il a reçu : un cap, une méthode et une main tendue. Il pilote la stratégie et les partenariats."

- prenom: "Lamine"
  nom: "Diaby"
  role: "Secrétaire & Directeur des opérations"
  photo: "/assets/img/team-lamine-card.webp"
  competences:
    - "Accompagnement des jeunes"
    - "Sens de l'humain"
    - "Entrepreneuriat"
    - "Esprit d'équipe"
    - "Confiance"
  presentation: "Curieux, réfléchi et animé par une volonté constante d'apprendre et de progresser. Engagé depuis de nombreuses années auprès des jeunes, Lamine anime des groupes et crée des ponts entre les pays, avec le regard d'un entrepreneur et l'expérience du monde de l'entreprise."

- prenom: "Soraya"
  nom: "Talha"
  role: "Trésorière & Directrice budget et finance"
  photo: "/assets/img/team-soraya-card.webp"
  competences:
    - "Gestion"
    - "Organisation"
    - "Coordination"
    - "Management d'équipe"
    - "Relations humaines"
  presentation: "Manager de terrain, Soraya met son sens de l'organisation au service de la solidarité et de l'entraide. Elle compte plus de 10 ans dans le Facility Management, à la tête d'équipes dans le nettoyage industriel : gestion, coordination et relations humaines sont son quotidien."

- prenom: "Valentin"
  nom: "Bouzeau"
  role: "Directeur pédagogique"
  photo: "/assets/img/team-valentin-card.webp"
  competences:
    - "Pédagogie"
    - "Coaching"
    - "Patience"
    - "Esprit d'équipe"
    - "Analyse"
  presentation: "Enseignant, coach et judoka, Valentin croit qu'on apprend autant des autres qu'on leur transmet. À l'Éducation nationale depuis de nombreuses années, il construit des classes soudées auprès des enfants, avec patience, positivité et la volonté d'avoir un impact positif dans la vie des autres."
