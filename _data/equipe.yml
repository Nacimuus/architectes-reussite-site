  presentation: "Curieux, réfléchi et animé par une volonté constante d'apprendre et de progresser. Engagé depuis de nombreuses années auprès des jeunes, Lamine anime des groupes et crée des ponts entre les pays, avec le regard d'un entrepreneur et l'expérience du monde de l'entreprise."

- prenom: "Valentin"
